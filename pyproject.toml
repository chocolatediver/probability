[project]
name = "probability-platform"
version = "0.6.0"
description = "AI Multi-Market Quant Research Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pytest>=8.0",
    "ccxt>=4.0",
    "yfinance>=0.2",
    "streamlit>=1.30",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "duckdb>=1.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "black>=24.0", "mypy>=1.10", "pre-commit>=3.7"]
ml = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2", "shap>=0.45", "optuna>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
